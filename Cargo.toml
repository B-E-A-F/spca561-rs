[package]
name = "spca561"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "Userspace capture for the Sunplus SPCA561A (Rev072A) USB webcam, 04fc:0561, with a live preview window"
repository = "https://github.com/B-E-A-F/spca561-rs"
readme = "README.md"

[dependencies]
# rusb vendors and builds libusb itself on Windows/MSVC, so no MSYS2 needed.
rusb = "0.9"
# Raw FFI, needed only because rusb has no safe isochronous API.
# This version MUST match the libusb1-sys that rusb pulls in, or you
# will link two copies of libusb and the handles won't be compatible.
# Check with: cargo tree -i libusb1-sys
libusb1-sys = "0.7"
# libusb1-sys imports `timeval` from libc privately, so it isn't re-exported.
# Same 0.2.x crate instance cargo already unifies for libusb1-sys, so the
# struct is literally the same type its FFI signatures expect.
libc = "0.2"
minifb = "0.28.0"
# Neural frame interpolation for mode 4, behind the `rife` feature.
# Off by default and deliberately so: ort pulls ONNX Runtime, a large native
# dependency, and the backend is useless without a RIFE .onnx on disk. The
# default build stays at the four crates above and mode 4 still works, just
# with the built-in block matcher instead.
# DirectML rather than CUDA: no CUDA or cuDNN install, works on any DX12 GPU,
# and at these frame sizes the difference is unmeasurable.
# Default features are left on deliberately. They carry download-binaries,
# which fetches ONNX Runtime itself -- without it the link fails on
# OrtGetApiBase -- and the TLS provider that download needs to build at all.
# So building this feature hits the network, twice: crates, then a runtime.
ort = { version = "2.0.0-rc.13", features = ["ndarray", "directml"], optional = true }
ndarray = { version = "0.17", optional = true }

[features]
default = []
# Everything that needs ONNX Runtime: the RIFE interpolator and the
# Real-ESRGAN upscaler both sit behind this.
onnx = ["dep:ort", "dep:ndarray"]
# Kept because it is the name the README has always documented, and because
# RIFE is the reason most people will turn this on.
rife = ["onnx"]
